services:
  database:
    image: mariadb:latest
    container_name: database
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - "${DB_HOST_PORT}:${DB_PORT}"
    volumes:
      - ./database/db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  adminer:
    container_name: db-panel
    depends_on:
      - database
    image: adminer
    restart: always
    ports:
      - "${ADMINER_HOST_PORT}:${ADMINER_PORT}"
    environment:
      ADMINER_DEFAULT_DRIVER: mysql
      ADMINER_DEFAULT_DB: ${DB_NAME}
      ADMINER_DEFAULT_SERVER: database
      ADMINER_DEFAULT_USERNAME: ${DB_USER}
      ADMINER_DEFAULT_PASSWORD: ${DB_PASSWORD}

  server:
    build:
      context: ./server
      dockerfile: ./Dockerfile
    container_name: server
    ports:
      - "${SERVER_HOST_PORT}:${SERVER_PORT}"
    volumes:
      - ./server:/app
      - ./wait-for.sh:/wait-for.sh
      - ./.env:/app/.env
    command: >
      sh -c '/wait-for.sh database:${DB_PORT} -- cp -rfu /cache/node_modules/. /app/node_modules/ && cp -fu /cache/package-lock.json /app/package-lock.json && npm run dev'
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - database
    
  webpage:
    build:
      context: ./webpage
      dockerfile: ./Dockerfile
    container_name: webpage
    ports:
      - "${WEBPAGE_HOST_PORT}:${WEBPAGE_PORT}"
    volumes:
      - ./webpage:/app
    command: >
      sh -c 'cp -rfu /cache/node_modules/. /app/node_modules/ && cp -fu /cache/package-lock.json /app/package-lock.json && npm run dev'